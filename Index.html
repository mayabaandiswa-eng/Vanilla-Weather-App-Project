<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Weather App</title>

    <link rel="stylesheet" href="SRC/style.css" />
</head>

<body>

    <main class="weather-app">

        <!-- SEARCH -->
        <form id="search-form">

            <input
                type="search"
                id="search-input"
                placeholder="Enter a city..."
                autocomplete="off"
                required
            />

            <button type="submit">
                Search
            </button>

        </form>


        <div id="error-message" class="error-message"></div>


    
        <div id="loading" class="loading">
            Loading weather...
        </div>


        <section class="weather-info">

            <div class="left">

                <h1 id="city">Cape Town</h1>

                <p id="date-time">
                    Tuesday 19:13
                </p>

                <p id="description">
                    Clear Sky
                </p>

                <p class="details">

                    Humidity:
                    <span id="humidity">87</span>%

                    <span class="divider">|</span>

                    Wind:
                    <span id="wind">4.63</span> km/h

                </p>

            </div>


            <div class="right">

                <img
                    id="icon"
                    src="https://shecodes-assets.s3.amazonaws.com/api/weather/icons/clear-sky-day.png"
                    alt="Weather icon"
                />

                <h2>
                    <span id="temperature">14</span>°C
                </h2>

            </div>

        </section>


        <section class="forecast-section">

            <h3>
                7-Day Forecast
            </h3>

            <div
                id="forecast"
                class="forecast"
            >
            
            </div>

        </section>


        <footer>

            This project was coded by
            <a href="https://github.com/mayabaandiswa-eng">
                Andiswa Mayaba
            </a>,

            is
            <a href="https://github.com/mayabaandiswa-eng/Vanilla-Search-Homework">
                open-source on GitHub
            </a>

            and hosted on
            <a href="https://app.netlify.com/">
                Netlify
            </a>

        </footer>

    </main>

    
    <script src="SRC/script.js"></script>

</body>
</html>
